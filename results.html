<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploring Atomic Orbitals: s, p, and d</title>
<style>
:root{
  --ink:#1f2937;
  --muted:#5f6b7a;
  --paper:#ffffff;
  --line:#d7dce2;
  --accent:#2f5d8a;
  --accent-dark:#214463;
  --good:#176b3a;
  --bad:#9b2c2c;
  --shadow:0 8px 26px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#eef1f4;
  line-height:1.55;
}
button,input{font:inherit}
button{cursor:pointer}
.shell{max-width:980px;margin:0 auto;padding:24px}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:28px;
  margin:20px 0;
}
.hero{text-align:center;padding:44px 28px}
h1{font-size:2.2rem;line-height:1.15;margin:.1em 0 .45em;color:var(--accent-dark)}
h2{font-size:1.55rem;margin:.1em 0 .55em;color:var(--accent-dark)}
h3{font-size:1.16rem;margin:1.2em 0 .45em}
p{margin:.55em 0}
.small{font-size:.92rem;color:var(--muted)}
.hidden{display:none!important}
.start-grid{max-width:560px;margin:22px auto 0;text-align:left}
label{font-weight:700;display:block;margin-bottom:7px}
input[type=text]{
  width:100%;
  border:1px solid #aeb7c2;
  border-radius:9px;
  padding:11px 12px;
  background:#fff;
}
.primary,.secondary{
  border:0;border-radius:9px;padding:11px 18px;font-weight:700
}
.primary{background:var(--accent);color:#fff}
.primary:hover,.primary:focus{background:var(--accent-dark)}
.secondary{background:#e8edf2;color:var(--ink)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.progress-wrap{
  position:sticky;top:0;z-index:10;background:#eef1f4;
  padding:10px 0 8px;
}
.progressbar{height:12px;background:#d7dde3;border-radius:999px;overflow:hidden}
.progressbar>div{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);margin-top:5px}
.concept{
  display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center
}
@media(max-width:760px){.concept{grid-template-columns:1fr}.shell{padding:12px}.card{padding:20px}}
.figure{
  border:1px solid var(--line);border-radius:12px;background:#fbfcfd;padding:14px;text-align:center
}
.figure svg{max-width:100%;height:auto}
.question .figure img{display:block;width:100%;height:auto}
.figcap{font-size:.9rem;color:var(--muted);margin-top:8px}
.keybox{
  border-left:5px solid var(--accent);
  background:#f3f7fb;padding:14px 16px;border-radius:8px;margin:14px 0
}
.quiz{
  margin-top:20px;padding-top:18px;border-top:1px solid var(--line)
}
.question{margin:18px 0 22px}
.question legend{font-weight:700;margin-bottom:8px}
.choice{
  display:block;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;margin:8px 0;background:#fff
}
.choice:hover{background:#f8fafc}
.choice input{margin-right:8px}
.feedback{margin-top:8px;font-weight:700}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.status-pill{
  display:inline-block;padding:3px 9px;border-radius:999px;background:#edf2f7;color:#334155;
  font-size:.84rem;font-weight:700
}
.orbital-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.orbital-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.orbital-grid{grid-template-columns:1fr}}
.orbital-tile{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.orbital-tile h3{margin:.2em 0 .4em;text-align:center}
.orbital-tile img{display:block;width:100%;height:auto;border-radius:8px;background:#fff}
.certificate{
  background:#fff;border:8px double var(--accent-dark);padding:42px 28px;text-align:center;
  max-width:850px;margin:20px auto;font-family:Georgia,"Times New Roman",serif
}
.certificate .cert-title{font-size:2.2rem;color:var(--accent-dark);margin:0 0 14px}
.certificate .student{font-size:2rem;margin:18px 0;border-bottom:1px solid #7b8794;display:inline-block;padding:0 22px 6px}
.certificate .score{font-size:1.1rem}
.notice{padding:12px 14px;border-radius:8px;background:#f1f5f9;margin:12px 0}
.summary-table{width:100%;border-collapse:collapse;margin-top:12px}
.summary-table th,.summary-table td{border:1px solid var(--line);padding:8px;text-align:left}
.summary-table th{background:#eef3f7}
footer{color:var(--muted);font-size:.86rem;text-align:center;margin:28px 0}
.screen-only{}
@media print{
  body{background:#fff}
  .screen-only,.progress-wrap,#tutorial,#startScreen,#resultsCard{display:none!important}
  #certificateSection{display:block!important}
  .certificate{box-shadow:none;margin:0;max-width:none;page-break-inside:avoid}
}

.match-panel{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.match-instructions{margin-bottom:14px}
.match-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
@media(max-width:900px){.match-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.match-grid{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.match-grid{grid-template-columns:1fr}}
.match-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;text-align:center}
.match-card img{display:block;width:100%;height:auto;border-radius:8px;background:#fff}
.dropzone{min-height:48px;margin-top:10px;border:2px dashed #aab4bf;border-radius:9px;padding:8px;display:flex;align-items:center;justify-content:center;background:#f8fafc}
.dropzone.ready{border-style:solid;border-color:var(--accent);background:#f3f7fb}
.dropzone.correct{border-style:solid;border-color:var(--good);background:#eef8f1}
.dropzone.incorrect{border-style:solid;border-color:var(--bad);background:#fff2f2}
.tile-bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.match-tile{border:1px solid #aeb7c2;border-radius:9px;padding:9px 13px;background:#fff;font-weight:700;cursor:grab;user-select:none}
.match-tile:focus,.match-tile.selected{outline:3px solid rgba(47,93,138,.25);border-color:var(--accent)}
.match-tile.dragging{opacity:.55}
.match-tile.locked{cursor:default}

</style>
</head>

<body>
<div class="shell">
  <section class="card" id="resultsCard">
    <div class="status-pill">Tutorial Results</div>
    <h1>Exploring Atomic Orbitals</h1>
    <p id="resultText"></p>
    <p id="submissionStatus" class="small"></p>

    <div class="btnrow screen-only">
      <button type="button" class="secondary" id="reviewBtn">Return to Tutorial</button>
      <button type="button" class="secondary" id="restartBtn">Start New Attempt</button>
    </div>
  </section>

  <section id="certificateSection" class="hidden">
    <div class="certificate" id="certificate">
      <div class="cert-title">Certificate of Completion</div>
      <p>This certifies that</p>
      <div class="student" id="certName">Student Name</div>
      <p>successfully completed the interactive tutorial</p>
      <h2 style="font-family:Georgia,'Times New Roman',serif">Exploring Atomic Orbitals: s, p, and d</h2>
      <p class="score" id="certScore"></p>
      <p id="certDate"></p>
    </div>

    <div class="btnrow screen-only" style="justify-content:center">
      <button class="primary" id="pdfBtn">Download / Save Certificate as PDF</button>
    </div>
    <p class="small screen-only" style="text-align:center">
      The button opens a print view containing only the certificate. Choose <strong>Save as PDF</strong>.
    </p>
  </section>
</div>

<script>
const name=(sessionStorage.getItem("orbitalTutorialStudentName")||"").trim();
const score=Number(sessionStorage.getItem("orbitalTutorialFinalScore"));
const total=Number(sessionStorage.getItem("orbitalTutorialFinalTotal"));
const pct=Number(sessionStorage.getItem("orbitalTutorialFinalPercent"));
const passed=sessionStorage.getItem("orbitalTutorialFinalPassed")==="yes";
const duration=Number(sessionStorage.getItem("orbitalTutorialFinalDuration"));
const saved=sessionStorage.getItem("orbitalTutorialSubmissionSaved")==="yes";

if(!name || !Number.isFinite(score) || !Number.isFinite(total)){
  window.location.replace("index.html");
}

function formatDuration(seconds){
  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;
  return (h ? String(h).padStart(2,"0")+":" : "")+
    String(m).padStart(2,"0")+":"+
    String(s).padStart(2,"0");
}

document.getElementById("resultText").innerHTML=
  "<strong>"+score+"/"+total+" correct ("+pct+"%).</strong> "+
  (passed
    ? "You met the 80% certificate requirement."
    : "You need at least 13/16 correct to receive the certificate.")+
  " Attempt time: <strong>"+formatDuration(duration)+"</strong>.";

document.getElementById("submissionStatus").textContent=
  saved
    ? "Your result was submitted successfully."
    : "Your score is complete, but the result could not be submitted automatically. Please tell your instructor.";

if(passed){
  document.getElementById("certName").textContent=name;
  document.getElementById("certScore").textContent="Score: "+score+"/"+total+" ("+pct+"%)";
  document.getElementById("certDate").textContent=
    "Completed "+new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  document.getElementById("certificateSection").classList.remove("hidden");
}

document.getElementById("reviewBtn").addEventListener("click",()=>{
  window.location.href="tutorial.html";
});

document.getElementById("restartBtn").addEventListener("click",()=>{
  sessionStorage.clear();
  window.location.href="index.html";
});

document.getElementById("pdfBtn")?.addEventListener("click",()=>{
  const certificate=document.getElementById("certificate");
  const printWindow=window.open("","_blank","width=900,height=700");

  if(!printWindow){
    alert("Your browser blocked the certificate print window. Allow pop-ups for this site and try again.");
    return;
  }

  printWindow.document.open();
  printWindow.document.write(`<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orbital Tutorial Certificate</title>
<style>
  @page { size: landscape; margin: 0.5in; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:#fff; font-family:Arial,Helvetica,sans-serif; color:#1f2933; }
  body { display:flex; justify-content:center; align-items:flex-start; }
  .certificate {
    width:100%;
    max-width:10in;
    min-height:6.8in;
    border:8px double #2f5d8a;
    padding:0.65in;
    text-align:center;
    background:#fff;
    box-shadow:none;
    margin:0;
  }
  .cert-title { font-family:Georgia,"Times New Roman",serif; font-size:32pt; font-weight:700; color:#21476d; margin-bottom:22px; }
  .student { font-family:Georgia,"Times New Roman",serif; font-size:26pt; font-weight:700; margin:18px 0; }
  h2 { font-family:Georgia,"Times New Roman",serif; font-size:22pt; color:#21476d; }
  p { font-size:14pt; margin:14px 0; }
  .score { font-size:18pt; font-weight:700; }
</style>
</head>
<body>${certificate.outerHTML}</body>
</html>`);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(()=>printWindow.print(),250);
});
</script>
</body>
</html>
